apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: tfg-frontend:v1
        imagePullPolicy: Never
        env:
        - name: API_TIMEOUT_SEC
          value: "4500"
        ports:
        - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort  # Esto expone la web hacia el exterior de Kubernetes para que puedas verla en tu navegador
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30001