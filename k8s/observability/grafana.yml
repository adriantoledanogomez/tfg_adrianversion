apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  sqlite.yml: |
    apiVersion: 1
    datasources:
      - name: TFG Historial SQLite
        uid: tfg-sqlite
        type: frser-sqlite-datasource
        access: proxy
        isDefault: true
        jsonData:
          path: /data/historial.db
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: TFG
        orgId: 1
        folder: TFG
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards/json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_INSTALL_PLUGINS
              value: frser-sqlite-datasource,yesoreyeram-infinity-datasource
          volumeMounts:
            - name: historial-data
              mountPath: /data
              readOnly: false
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/sqlite.yml
              subPath: sqlite.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/json
      volumes:
        - name: historial-data
          persistentVolumeClaim:
            claimName: historial-pvc
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-tfg
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30002
