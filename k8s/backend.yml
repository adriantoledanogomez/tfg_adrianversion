apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-job-runner
      automountServiceAccountToken: true
      containers:
      - name: backend
        image: tfg-backend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: WORKER_MODE
          value: "kubernetes"
        - name: HISTORY_ENABLED
          value: "1"
        - name: HISTORY_DB_PATH
          value: /data/historial.db
        - name: JOBS_ROOT
          value: /data/jobs
        - name: OLLAMA_URL
          value: "http://ollama:11434"
        - name: WORKER_IMAGE
          value: "tfg-backend:v1"
        - name: WORKER_IMAGE_PULL_POLICY
          value: "Never"
        - name: K8S_NAMESPACE
          value: "default"
        volumeMounts:
        - name: historial-data
          mountPath: /data
      volumes:
      - name: historial-data
        persistentVolumeClaim:
          claimName: historial-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
